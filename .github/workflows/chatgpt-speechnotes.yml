name: Build Speech Notes APK

on:
  push:
    branches: [ chatgpt-whisper-dictation-v1 ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: speechnotes-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SPEECHNOTES_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-whisper-dictation-v1

      - name: Initialize live progress
        run: bash .github/speechnotes-progress.sh initialize running "Runner started; source checkout complete"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          bash .github/speechnotes-progress.sh android_sdk running "Installing Android 35, NDK 27 and CMake 3.22.1"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          bash .github/speechnotes-progress.sh android_sdk done "Android SDK components ready"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch pinned whisper.cpp
        run: |
          bash .github/speechnotes-progress.sh whisper_source running "Cloning whisper.cpp v1.9.1"
          rm -rf SpeechNotes/app/src/main/cpp/whispercpp
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp SpeechNotes/app/src/main/cpp/whispercpp
          bash .github/speechnotes-progress.sh whisper_source done "whisper.cpp v1.9.1 fetched"

      - name: Apply Speech Notes patches
        run: |
          bash .github/speechnotes-progress.sh patches running "Applying v1.8.5 runtime-session unification and recording guard fix"
          python3 .github/patch_speechnotes_whisper_timings.py
          python3 .github/patch_speechnotes_benchmark_tab.py
          python3 .github/patch_speechnotes_v150_runtime.py
          python3 .github/patch_speechnotes_v170_cpu_lab.py
          python3 .github/patch_speechnotes_v180_kleidiai_backend.py
          python3 .github/patch_speechnotes_v180_encoder_lab.py
          python3 .github/patch_speechnotes_v182_diagnostics.py
          python3 .github/patch_speechnotes_v183_trigger_lab.py
          python3 .github/patch_speechnotes_v184_recording_fix.py
          python3 .github/patch_speechnotes_v185_runtime_session.py
          bash .github/speechnotes-progress.sh patches done "Unified native runtime state + self-healing recording guards applied"

      - name: Build host quantizer
        run: |
          set -euo pipefail
          bash .github/speechnotes-progress.sh quantizer_build running "Building whisper.cpp v1.9.1 host quantizer"
          rm -rf /tmp/whisper-host
          cmake -S SpeechNotes/app/src/main/cpp/whispercpp -B /tmp/whisper-host -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_SERVER=OFF -DGGML_VULKAN=OFF -DGGML_NATIVE=ON
          cmake --build /tmp/whisper-host --target whisper-quantize -j2
          test -x /tmp/whisper-host/bin/whisper-quantize
          bash .github/speechnotes-progress.sh quantizer_build done "Pinned quantizer ready"

      - name: Prepare models
        run: |
          set -euo pipefail
          bash .github/speechnotes-progress.sh models running "Downloading Q5 models and Turbo source"
          rm -rf SpeechNotes/app/src/main/assets/models
          mkdir -p SpeechNotes/app/src/main/assets/models
          curl -fL --retry 5 --retry-delay 5 -o SpeechNotes/app/src/main/assets/models/ggml-base-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          curl -fL --retry 5 --retry-delay 5 -o SpeechNotes/app/src/main/assets/models/ggml-large-v3-turbo-q5_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
          curl -fL --retry 5 --retry-delay 5 -o /tmp/ggml-large-v3-turbo.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin
          echo "a3733eda680ef76256db5fc5dd9de8629e62c5e7  SpeechNotes/app/src/main/assets/models/ggml-base-q5_1.bin" | sha1sum -c -
          echo "e050f7970618a659205450ad97eb95a18d69c9ee  SpeechNotes/app/src/main/assets/models/ggml-large-v3-turbo-q5_0.bin" | sha1sum -c -
          bash .github/speechnotes-progress.sh models done "Q5 models verified and Turbo source ready"

      - name: Quantize Turbo Q4_0
        run: |
          set -euo pipefail
          bash .github/speechnotes-progress.sh quantize_q4 running "Quantizing official Turbo source to Q4_0"
          /tmp/whisper-host/bin/whisper-quantize /tmp/ggml-large-v3-turbo.bin SpeechNotes/app/src/main/assets/models/ggml-large-v3-turbo-q4_0.bin q4_0 2>&1 | tee /tmp/quantize-q4.log
          test "$(stat -c%s SpeechNotes/app/src/main/assets/models/ggml-large-v3-turbo-q4_0.bin)" -gt 300000000
          sha256sum SpeechNotes/app/src/main/assets/models/ggml-large-v3-turbo-q4_0.bin | tee -a /tmp/quantize-q4.log
          rm -f /tmp/ggml-large-v3-turbo.bin
          bash .github/speechnotes-progress.sh quantize_q4 done "Turbo Q4_0 generated and verified" /tmp/quantize-q4.log

      - name: Restore signing key
        run: |
          bash .github/speechnotes-progress.sh signing running "Restoring persistent APK signing key"
          base64 -d .github/speechnotes-showcase.jks.b64 > SpeechNotes/showcase-release.jks
          bash .github/speechnotes-progress.sh signing done "Signing key restored"

      - name: Build signed release APK
        run: |
          set -o pipefail
          bash .github/speechnotes-progress.sh native_build running "v1.8.5 Gradle+CMake build starting"
          rm -f /tmp/speechnotes-gradle.log
          (cd SpeechNotes && gradle --no-daemon :app:assembleRelease) 2>&1 | tee /tmp/speechnotes-gradle.log
          bash .github/speechnotes-progress.sh native_build done "v1.8.5 Gradle+CMake build completed" /tmp/speechnotes-gradle.log

      - name: Android lint review gate
        run: |
          set -o pipefail
          bash .github/speechnotes-progress.sh lint_review running "Running Android lint review before streaming work"
          rm -f /tmp/speechnotes-lint.log
          (cd SpeechNotes && gradle --no-daemon :app:lintRelease) 2>&1 | tee /tmp/speechnotes-lint.log
          bash .github/speechnotes-progress.sh lint_review done "Android lint review passed" /tmp/speechnotes-lint.log

      - name: Inspect APK
        run: |
          set -euo pipefail
          bash .github/speechnotes-progress.sh apk_inspect running "Verifying v1.8.5 APK contents"
          cd SpeechNotes
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk > /tmp/apk-files.txt
          grep -q 'libggml-cpu-android_armv9.0_1.so' /tmp/apk-files.txt
          grep -q 'libggml-cpu-android_armv9.0_1_kai.so' /tmp/apk-files.txt
          grep -q 'assets/models/ggml-large-v3-turbo-q4_0.bin' /tmp/apk-files.txt
          ! grep -q 'libggml-vulkan.so' /tmp/apk-files.txt
          cp app/build/outputs/apk/release/app-release.apk ../SpeechNotes-1.8.5.apk
          cd ..
          bash .github/speechnotes-progress.sh apk_inspect done "Signed v1.8.5 APK verified; Q4 + ARMv9 + KAI present; Vulkan absent"

      - uses: actions/upload-artifact@v4
        with:
          name: SpeechNotes-v1.8.5-arm64
          path: SpeechNotes-1.8.5.apk
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/speechnotes-progress.sh release running "Publishing speechnotes-v1.8.5"
          gh release delete speechnotes-v1.8.5 --yes --cleanup-tag || true
          gh release create speechnotes-v1.8.5 SpeechNotes-1.8.5.apk#SpeechNotes-1.8.5.apk --repo "$GITHUB_REPOSITORY" --target "$SPEECHNOTES_SOURCE_SHA" --title "Speech Notes v1.8.5" --notes "Pre-streaming prototype focused on runtime correctness. UI and RecordingService now share one native-backed SpeechRuntimeSession, with exact model-path/backend-mode introspection and self-healing context restoration if a benchmark or lifecycle transition changed the active Whisper context. The v1.8.4 recording guard mismatch is removed, package-install exits are filtered from crash diagnostics, and Android lint is enforced in CI. Productive default remains Large-v3-Turbo Q4_0 / stock ARMv9 / 4T / audio_ctx 1280 / no affinity. Streaming remains intentionally disabled in this build."
          bash .github/speechnotes-progress.sh release done "speechnotes-v1.8.5 published with APK asset"

      - name: Record build status
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          BUILD_SHA: ${{ env.SPEECHNOTES_SOURCE_SHA }}
        run: |
          printf 'status=%s\nsource_commit=%s\nrecorded_utc=%s\n' "$BUILD_STATUS" "$BUILD_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/speechnotes-build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/speechnotes-build-status.txt
          git commit -m "[skip ci] Speech Notes build status: $BUILD_STATUS" || exit 0
          git push origin HEAD:chatgpt-whisper-dictation-v1
