name: Build Speech Notes APK

on:
  push:
    branches: [ chatgpt-whisper-dictation-v1 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-whisper-dictation-v1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch pinned whisper.cpp
        run: |
          cd SpeechNotes
          rm -rf app/src/main/cpp/whispercpp
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp app/src/main/cpp/whispercpp

      - name: Extend pinned whisper.cpp timing API
        run: |
          python3 - <<'PY'
          from pathlib import Path

          h = Path('SpeechNotes/app/src/main/cpp/whispercpp/include/whisper.h')
          s = h.read_text()
          old = '''    struct whisper_timings {
              float sample_ms;
              float encode_ms;
              float decode_ms;
              float batchd_ms;
              float prompt_ms;
          };'''
          new = '''    struct whisper_timings {
              float mel_ms;
              float total_ms;
              float sample_ms;
              float sample_total_ms;
            int32_t sample_n;
              float encode_ms;
              float encode_total_ms;
            int32_t encode_n;
              float decode_ms;
              float decode_total_ms;
            int32_t decode_n;
              float batchd_ms;
              float batchd_total_ms;
            int32_t batchd_n;
              float prompt_ms;
              float prompt_total_ms;
            int32_t prompt_n;
          };'''
          if old not in s:
              raise SystemExit('whisper_timings header block not found')
          h.write_text(s.replace(old, new, 1))

          cpp = Path('SpeechNotes/app/src/main/cpp/whispercpp/src/whisper.cpp')
          s = cpp.read_text()
          old = '''    whisper_timings * timings = new whisper_timings;
              timings->sample_ms = 1e-3f * ctx->state->t_sample_us / std::max(1, ctx->state->n_sample);
              timings->encode_ms = 1e-3f * ctx->state->t_encode_us / std::max(1, ctx->state->n_encode);
              timings->decode_ms = 1e-3f * ctx->state->t_decode_us / std::max(1, ctx->state->n_decode);
              timings->batchd_ms = 1e-3f * ctx->state->t_batchd_us / std::max(1, ctx->state->n_batchd);
              timings->prompt_ms = 1e-3f * ctx->state->t_prompt_us / std::max(1, ctx->state->n_prompt);
              return timings;'''
          new = '''    whisper_timings * timings = new whisper_timings;
              timings->mel_ms = 1e-3f * ctx->state->t_mel_us;
              timings->total_ms = (ggml_time_us() - ctx->t_start_us) / 1000.0f;

              timings->sample_n = ctx->state->n_sample;
              timings->sample_total_ms = 1e-3f * ctx->state->t_sample_us;
              timings->sample_ms = timings->sample_total_ms / std::max(1, timings->sample_n);

              timings->encode_n = ctx->state->n_encode;
              timings->encode_total_ms = 1e-3f * ctx->state->t_encode_us;
              timings->encode_ms = timings->encode_total_ms / std::max(1, timings->encode_n);

              timings->decode_n = ctx->state->n_decode;
              timings->decode_total_ms = 1e-3f * ctx->state->t_decode_us;
              timings->decode_ms = timings->decode_total_ms / std::max(1, timings->decode_n);

              timings->batchd_n = ctx->state->n_batchd;
              timings->batchd_total_ms = 1e-3f * ctx->state->t_batchd_us;
              timings->batchd_ms = timings->batchd_total_ms / std::max(1, timings->batchd_n);

              timings->prompt_n = ctx->state->n_prompt;
              timings->prompt_total_ms = 1e-3f * ctx->state->t_prompt_us;
              timings->prompt_ms = timings->prompt_total_ms / std::max(1, timings->prompt_n);
              return timings;'''
          if old not in s:
              raise SystemExit('whisper_get_timings implementation block not found')
          cpp.write_text(s.replace(old, new, 1))
          PY

      - name: Download bundled Base and Large-v3-Turbo models
        run: |
          cd SpeechNotes
          rm -rf app/src/main/assets/models
          mkdir -p app/src/main/assets/models
          curl -fL --retry 4 -o app/src/main/assets/models/ggml-base-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          curl -fL --retry 4 -o app/src/main/assets/models/ggml-large-v3-turbo-q5_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
          echo "a3733eda680ef76256db5fc5dd9de8629e62c5e7  app/src/main/assets/models/ggml-base-q5_1.bin" | sha1sum -c -
          echo "e050f7970618a659205450ad97eb95a18d69c9ee  app/src/main/assets/models/ggml-large-v3-turbo-q5_0.bin" | sha1sum -c -
          ls -lh app/src/main/assets/models/

      - name: Restore persistent showcase signing key
        run: |
          base64 -d .github/speechnotes-showcase.jks.b64 > SpeechNotes/showcase-release.jks
          keytool -list -keystore SpeechNotes/showcase-release.jks -storepass chatgpt-showcase -alias speechnotes

      - name: Build signed release APK
        working-directory: SpeechNotes
        run: gradle --no-daemon :app:assembleRelease

      - name: Inspect APK
        run: |
          cd SpeechNotes
          ls -lh app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ../SpeechNotes-1.2.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeechNotes-v1.2.1-arm64
          path: SpeechNotes-1.2.1.apk
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete speechnotes-v1.2.1 --yes --cleanup-tag || true
          gh release create speechnotes-v1.2.1 \
            SpeechNotes-1.2.1.apk#SpeechNotes-1.2.1.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Speech Notes v1.2.1" \
            --notes "Deterministic profiling release. Keeps a PARTIAL_WAKE_LOCK active through recording and the full local transcription so screen-off cannot suspend CPU work. Extends pinned whisper.cpp v1.9.1 timing data with Mel, native total time, per-stage total time, run counts, and per-run averages. Resident Base Q5_1 and Large-v3-Turbo Q5_0 architecture remains unchanged; no ARM/thread/Flash-Attention/Vulkan performance tuning is included yet. Transcript fade is slightly refined. Uses the persistent v1.1+ signing key for in-place upgrades."
