name: Build Speech Notes APK

on:
  push:
    branches: [ chatgpt-whisper-dictation-v1 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-whisper-dictation-v1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch pinned whisper.cpp
        run: |
          cd SpeechNotes
          rm -rf app/src/main/cpp/whispercpp
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp app/src/main/cpp/whispercpp

      - name: Download bundled Q5_1 models
        run: |
          cd SpeechNotes
          mkdir -p app/src/main/assets/models
          curl -fL --retry 4 -o app/src/main/assets/models/ggml-tiny-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin
          curl -fL --retry 4 -o app/src/main/assets/models/ggml-base-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          curl -fL --retry 4 -o app/src/main/assets/models/ggml-small-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          echo "2827a03e495b1ed3048ef28a6a4620537db4ee51  app/src/main/assets/models/ggml-tiny-q5_1.bin" | sha1sum -c -
          echo "a3733eda680ef76256db5fc5dd9de8629e62c5e7  app/src/main/assets/models/ggml-base-q5_1.bin" | sha1sum -c -
          echo "6fe57ddcfdd1c6b07cdcc73aaf620810ce5fc771  app/src/main/assets/models/ggml-small-q5_1.bin" | sha1sum -c -

      - name: Generate deterministic prototype signing keystore
        run: |
          cd SpeechNotes
          rm -f showcase-release.jks
          keytool -genkeypair -v \
            -keystore showcase-release.jks \
            -storetype JKS \
            -storepass chatgpt-showcase \
            -keypass chatgpt-showcase \
            -alias speechnotes \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Speech Notes ChatGPT Showcase, OU=Prototype, O=OpenAI Chat Showcase, L=Vienna, C=AT"

      - name: Build signed release APK
        working-directory: SpeechNotes
        run: gradle --no-daemon :app:assembleRelease

      - name: Inspect APK
        run: |
          cd SpeechNotes
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ../SpeechNotes-1.0.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeechNotes-v1.0.1-arm64
          path: SpeechNotes-1.0.1.apk
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete speechnotes-v1.0.1 --yes --cleanup-tag || true
          gh release create speechnotes-v1.0.1 \
            SpeechNotes-1.0.1.apk#SpeechNotes-1.0.1.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Speech Notes v1.0.1" \
            --notes "UI maintenance release: expandable full transcripts, fixed bottom navigation, and Android system-bar inset handling. Offline Whisper Tiny/Base/Small Q5_1 remain bundled."
