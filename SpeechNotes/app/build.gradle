plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chatgpt.speechnotes'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chatgpt.speechnotes'
        minSdk 28
        targetSdk 35
        versionCode 18
        versionName "1.8.5"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-O3 -std=c++17'
                arguments '-DANDROID_STL=c++_shared', '-DCMAKE_BUILD_TYPE=Release'
            }
        }
    }

    signingConfigs {
        release {
            storeFile file('../showcase-release.jks')
            storePassword 'chatgpt-showcase'
            keyAlias 'speechnotes'
            keyPassword 'chatgpt-showcase'
        }
    }

    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release'
                }
            }
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    ndkVersion '27.0.12077973'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
